<!DOCTYPE html>
<html>

<head>
    <title>Puter GPT-4 Chat</title>
</head>

<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        puter.ai.chat("Python Script for while true loop", {
            model: "gpt-4o" // free tier model — try "gpt-4" too, but gpt-4o is the safer free bet
        }).then(response => {
            document.body.innerHTML = response.message.content;
        });
    </script>
</body>

</html>
